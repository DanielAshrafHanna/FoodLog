<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174A3B" />
    <title>FoodLog is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f3f1e8; color: #18352a; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 520px); padding: 28px; border: 1px solid #b8c5bb; border-radius: 18px; background: #fffdf6; }
      h1 { margin: 0 0 10px; font-size: clamp(2rem, 8vw, 3.5rem); line-height: .95; }
      p { line-height: 1.6; }
      button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #174a3b; color: white; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) { :root { background: #111512; color: #e7eee8; } main { background: #18201b; border-color: #405047; } }
    </style>
  </head>
  <body>
    <main>
      <p>Table Notes</p>
      <h1>You’re offline.</h1>
      <p>The FoodLog app shell is ready, but this page was not available from the network. Reconnect and try again; previously loaded restaurant data remains in the browser cache.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
