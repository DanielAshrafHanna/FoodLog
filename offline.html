<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#073D4A" />
    <title>FoodLog is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f7f8f8; color: #142f38; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 520px); padding: 28px; border: 1px solid #dce5e7; border-radius: 18px; background: #ffffff; }
      h1 { margin: 0 0 10px; font-size: clamp(2rem, 8vw, 3.5rem); line-height: .95; }
      p { line-height: 1.6; }
      button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: #073d4a; color: white; font: inherit; font-weight: 700; }
      @media (prefers-color-scheme: dark) { :root { background: #071e25; color: #f2f7f8; } main { background: #0d2c35; border-color: #557a85; } button { background: #1ea1c2; color: #071e25; } }
    </style>
  </head>
  <body>
    <main>
      <p>Table Notes</p>
      <h1>You’re offline.</h1>
      <p>The FoodLog app shell is ready, but this page was not available from the network. Reconnect and try again; previously loaded restaurant data remains in the browser cache.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
